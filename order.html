<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div class="header-inner">
    <h1 class="brand">Order Menu</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="order.html">Order</a>
      <a href="signup.html">Sign Up</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

  </div>
</header>

<main class="order-container">

  <h2 class="page-title">Menu List</h2>

  <section class="menu-grid">

    <div class="menu-card"><img src="images/caldereta.jpg"><h3>Caldereta Ribs</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/bicol.jpg"><h3>Bicol Express</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/sinigang.jpg"><h3>Sinigang Baka</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/nilaga.jpg"><h3>Nilagang Baboy</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/porksteak.jpg"><h3>Pork Steak</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/teriyaki.jpg"><h3>Pork Teriyaki</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/chicken-curry.jpg"><h3>Chicken Curry</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/menudo.jpg"><h3>Menudo</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/shanghai.jpg"><h3>Shanghai</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/okoy.jpg"><h3>Okoy</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/prito-isda.jpg"><h3>Prito Isda</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/longganisa.jpg"><h3>Longganisa</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

    <div class="menu-card"><img src="images/embutido.jpg"><h3>Embutido</h3><div class="qty"><button>-</button><input value="1"><button>+</button></div><button class="btn">Add</button></div>

  </section>

  <aside class="cart">
    <h2>Your Order</h2>
    <p>No items yet</p>
    <button class="checkout">Checkout</button>
  </aside>

</main>

<footer>
  <p>This is merely a Showcase. (Grow A Website)</p>
</footer>
<script>
  const cards = document.querySelectorAll('.menu-card');
  const cartDisplay = document.querySelector('.cart p');

  cards.forEach(card => {
    const minusBtn = card.querySelector('.qty button:first-of-type');
    const plusBtn = card.querySelector('.qty button:last-of-type');
    const input = card.querySelector('input');
    const addBtn = card.querySelector('.btn');
    const itemName = card.querySelector('h3').innerText;

    plusBtn.onclick = function() {
      let currentVal = parseInt(input.value);
      input.value = currentVal + 1;
    };

    minusBtn.onclick = function() {
      let currentVal = parseInt(input.value);
      if (currentVal > 1) {
        input.value = currentVal - 1;
      }
    };

    addBtn.onclick = function() {
      if (cartDisplay.innerText === "No items yet") {
        cartDisplay.innerHTML = "";
      }
      
      cartDisplay.innerHTML += "<div>" + input.value + "x " + itemName + "</div>";
      
      alert("Added " + input.value + " " + itemName + " to your order!");
      input.value = 1;
    };
  });
</script>
</body>
</html>
